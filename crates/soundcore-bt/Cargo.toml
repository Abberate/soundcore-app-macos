[package]
name = "soundcore-bt"
description = "macOS IOBluetooth RFCOMM transport for soundcore headphones"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-foundation = { workspace = true, features = ["NSArray", "NSString", "NSObject", "NSData", "NSDate", "NSRunLoop"] }
objc2-core-foundation = { workspace = true, features = ["CFRunLoop", "CFString", "CFDate", "block2"] }
objc2-io-bluetooth = { workspace = true }
block2.workspace = true
dispatch2 = "0.3"
